openapi: 3.1.3

info:
  title: svc-cotizacion — Cotización de vida hipotecario
  summary: Cotización de seguro de vida sobre crédito hipotecario, una activa por cliente.
  description: |
    Recibe la edad (ya calculada por el BFF) y los datos del crédito de un cliente
    autenticado, lee su perfil de riesgo de Perfilamiento y la tabla de tasas de Productos,
    y devuelve un precio (personalizado o, si el perfilamiento no responde, estándar).

    Historia funcional: BITS-95 (hija de BITS-72). Perfilamiento: BITS-106.
    Diseño de referencia: pagina "Cotizacion y Rating" de David (Confluence).
    NFR: BITS-79 (latencia), BITS-81 (escalabilidad), BITS-124 (disponibilidad).

    **Una sola cotización activa por cliente.** No tiene id propio: crear una nueva reemplaza
    la anterior (el cliente no acumula cotizaciones, compra pólizas). La activa se consulta
    con `GET /v1/cotizaciones/actual`.

    **Cálculo de la prima mensual.** `prima_base = saldo_insoluto × tasa ÷ 1.000`, redondeada
    al peso, con la tasa de la franja de edad de la tarifa vigente. Con perfil:
    `prima_mensual = prima_base × factor_ajuste` (redondeada al peso) y `personalizado = true`.
    Sin perfil, o si Perfilamiento no responde: `prima_mensual = prima_base`,
    `personalizado = false` y `perfilamiento` en `fuentesNoDisponibles`. La suma asegurada es
    el saldo insoluto. Cada cotización guarda la tasa y la versión de tarifa con que se calculó.

    **Estado.** `VIGENTE` durante 30 días desde su creación y `EXPIRADA` después. Se deriva al
    consultar.

    **Cobertura opcional de Hogar (incendio y terremoto).** Además de Vida, la respuesta trae
    en `oferta.desglose` el precio de cada cobertura, con su IVA. Hogar es opcional y NO viene
    marcada por defecto: el servicio no guarda la selección del cliente ni devuelve totales;
    el front suma `primaNeta`, `iva` y `primaTotal` de las coberturas que el cliente elija.
    - Suma asegurada de Hogar: `min(240.000.000, valorCredito)`.
    - `primaNeta = sumaAsegurada × 0,099 ÷ 1.000`, redondeada al peso (ROUND_HALF_UP).
    - `iva = primaNeta × 0,19`, redondeado al peso (ROUND_HALF_UP). Vida no lleva IVA.
    - `primaTotal = primaNeta + iva`. El factor de ajuste del perfil no afecta a Hogar.

    Alcance: el precio de Vida y de la cobertura opcional de Hogar. Fuera de alcance:
    persistir la selección de coberturas, servicios adicionales del hogar, rutas APROBADA /
    RECHAZADA, estados de cotización incompleta y recálculo cuando llega el perfil (BITS-224).

    Identidad y consentimiento los resuelven el API Gateway y el BFF; este servicio
    recibe el id del cliente en el encabezado X-Cliente-Id.

    Convenciones de datos (VI-002): montos en COP como numero.

    Errores en formato RFC 9457 (Problem Details), application/problem+json.
  version: 0.3.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/cotizacion
    description: Entorno de desarrollo

tags:
  - name: Cotización
    description: Generación y consulta de la cotización activa de vida hipotecario.

paths:
  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Calcula la cotización y la deja como la activa del cliente
      description: |
        Valida la solicitud, lee el perfil y la tarifa, calcula el precio y guarda la cotización
        como la activa del cliente, reemplazando la anterior si la había.

        Responde 400 señalando el campo cuando la edad no está entre 18 y 65 años, o cuando el
        crédito terminaría después de los 75 años (`edad + plazoRestanteMeses / 12 > 75`).

        Si el Perfilamiento no responde a tiempo, devuelve el precio estándar con
        personalizado: false (no es un error). Si no hay tarifa (Productos caído y sin caché),
        responde 503.
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCotizacion' }
      responses:
        '201':
          description: Cotización generada. Es ahora la activa del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '503': { $ref: '#/components/responses/NoSePudoCotizar' }

  /v1/cotizaciones/actual:
    get:
      operationId: obtenerCotizacionActiva
      tags: [Cotización]
      summary: Consulta la cotización activa del cliente
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: La cotización activa. `estado` es `EXPIRADA` si ya pasó su vigencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:

  parameters:
    ClienteId:
      name: X-Cliente-Id
      in: header
      required: true
      description: Id del cliente autenticado. Lo inyecta el BFF a partir del token.
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada, esquema inválido, edad fuera de rango o plazo que supera la edad máxima.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El cliente no tiene una cotización activa.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoSePudoCotizar:
      description: No se pudo calcular ni el precio estándar (tarifa no disponible).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:

    NivelRiesgo:
      type: string
      enum: [BAJO, MEDIO, ALTO]

    EstadoCotizacion:
      type: string
      enum: [VIGENTE, EXPIRADA]

    EfectoFactor:
      type: string
      enum: [POSITIVO, NEGATIVO]

    Moneda:
      type: string
      enum: [COP]

    OrigenDatos:
      type: string
      enum: [DECLARADO]
      description: |
        De dónde salen los datos del crédito. Hoy los escribe el cliente (`DECLARADO`);
        verificarlos contra la fuente es de BITS-224.

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoRestanteMeses, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito:
          type: number
          minimum: 10000000
          description: Monto del crédito en COP.
        plazoRestanteMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: Meses que le faltan al crédito. Con la edad, no puede pasar de los 75 años.
        entidadAcreedora:
          type: string
          minLength: 2
          maxLength: 80
        saldoInsoluto:
          type: number
          exclusiveMinimum: 0
          description: Saldo pendiente del crédito en COP.

    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required: [edad, datosCredito]
      properties:
        edad:
          type: integer
          description: |
            Años cumplidos del cliente. Lo calcula el BFF desde la fecha de nacimiento del
            registro; el servicio exige que esté entre 18 y 65.
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion:
          type: string
          description: En lenguaje no técnico (BITS-109). No expone datos financieros crudos.
        efecto: { $ref: '#/components/schemas/EfectoFactor' }
        pesoRelativo: { type: number, minimum: 0, maximum: 1 }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { $ref: '#/components/schemas/NivelRiesgo' }
        factores:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado, desglose]
      example:
        primaMensual: 39734
        primaBaseMensual: 46746
        sumaAsegurada: 320000000
        coberturaMeses: 240
        moneda: COP
        personalizado: true
        fuentesNoDisponibles: []
        desglose:
          coberturas:
            - codigo: VIDA
              obligatoria: true
              sumaAsegurada: 320000000
              primaNeta: 39734
              iva: 0
              primaTotal: 39734
            - codigo: HOGAR
              obligatoria: false
              sumaAsegurada: 240000000
              primaNeta: 23760
              iva: 4514
              primaTotal: 28274
      properties:
        primaMensual:
          type: number
          minimum: 0
          description: Prima aplicada. Igual a primaBaseMensual si personalizado es false.
        primaBaseMensual:
          type: number
          minimum: 0
          description: Prima con tarifa estándar, sin ajuste por perfil.
        sumaAsegurada:
          type: number
          minimum: 0
          description: Cobertura = saldo insoluto del crédito (protección de la deuda).
        coberturaMeses:
          type: integer
          minimum: 1
          description: Igual al plazo restante del crédito.
        moneda: { $ref: '#/components/schemas/Moneda' }
        personalizado:
          type: boolean
          description: false = el perfilamiento no respondió y se usó tarifa estándar (respuesta degradada).
        fuentesNoDisponibles:
          type: array
          items: { type: string }
          description: Fuentes de perfilamiento que no respondieron.
        desglose: { $ref: '#/components/schemas/Desglose' }

    CodigoCobertura:
      type: string
      enum: [VIDA, HOGAR]

    CoberturaPrecio:
      type: object
      additionalProperties: false
      required: [codigo, obligatoria, sumaAsegurada, primaNeta, iva, primaTotal]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoCobertura' }
        obligatoria:
          type: boolean
          description: true para VIDA (la exige el crédito), false para HOGAR.
        sumaAsegurada:
          type: number
          minimum: 0
          description: |
            VIDA: saldo insoluto del crédito. HOGAR: `min(240.000.000, valorCredito)`.
        primaNeta:
          type: number
          minimum: 0
          description: Prima mensual sin IVA. En VIDA es la prima ya ajustada por perfil (igual a `oferta.primaMensual`).
        iva:
          type: number
          minimum: 0
          description: IVA mensual de la cobertura. 0 en VIDA; 19 % de `primaNeta` en HOGAR.
        primaTotal:
          type: number
          minimum: 0
          description: Prima mensual con IVA (`primaNeta + iva`). Es lo que el front suma al marcar la cobertura.

    Desglose:
      type: object
      additionalProperties: false
      required: [coberturas]
      description: |
        Precio de cada cobertura. No trae totales: el servicio no guarda la selección del
        cliente, así que el front suma los `primaNeta`, `iva` y `primaTotal` de las coberturas
        que el cliente elija.
      properties:
        coberturas:
          type: array
          minItems: 2
          description: Todas las coberturas con su precio, VIDA y HOGAR.
          items: { $ref: '#/components/schemas/CoberturaPrecio' }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    Cotizacion:
      type: object
      additionalProperties: false
      required: [estado, producto, datosCredito, origenDatos, oferta, vigenciaCotizacion, creadaEn]
      properties:
        estado: { $ref: '#/components/schemas/EstadoCotizacion' }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos: { $ref: '#/components/schemas/OrigenDatos' }
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          description: Presente solo cuando oferta.personalizado es true.
          $ref: '#/components/schemas/PerfilRiesgo'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
