openapi: 3.1.3

info:
  title: svc-cotizacion — Cotización y Rating
  summary: Cálculo de prima y condiciones de cobertura en línea para productos de Solventa.
  description: |
    Servicio de dominio que recibe una solicitud de cotización y devuelve una
    cotización con precio, coberturas y una vigencia limitada.

    Alcance de esta versión (`0.1.x`): ramo **protección de dispositivos**
    (`PROTECCION_DISPOSITIVO`). Otros ramos y el perfilamiento hipotecario se
    agregan en versiones posteriores.

    Entrada real: `... -> API Gateway -> BFF / PartnerAPI -> svc-cotizacion`.
    La autenticación la resuelven el API Gateway y el BFF; este servicio confía
    en la identidad que le llega.

    Historia funcional: BITS-95. NFR: BITS-79 (latencia), BITS-81 (escalabilidad),
    BITS-124 (disponibilidad).

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://api.dev.solventa4bits.com/cotizacion
    description: Entorno de desarrollo

tags:
  - name: Cotización
    description: Generación de cotizaciones.

paths:
  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Genera una cotización para una solicitud
      description: |
        Calcula la prima y las condiciones de cobertura para el riesgo descrito y
        devuelve una cotización con estado `VIGENTE` y una vigencia limitada. La
        cotización es inmutable: su precio queda fijo para poder aceptarla luego.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCotizacion' }
      responses:
        '201':
          description: Cotización generada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ReglaNegocio' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

components:

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ReglaNegocio:
      description: La solicitud es válida pero incumple una regla de negocio (ej. ramo no habilitado para cotización).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DependenciaNoDisponible:
      description: Una dependencia aguas abajo no respondió a tiempo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:

    Ramo:
      type: string
      enum: [PROTECCION_DISPOSITIVO]

    Moneda:
      type: string
      enum: [COP]

    EstadoCotizacion:
      type: string
      enum: [VIGENTE, EXPIRADA, ACEPTADA, RECHAZADA]

    Canal:
      type: object
      additionalProperties: false
      required: [tipo, socioId]
      properties:
        tipo: { type: string, enum: [SOCIO, ASESOR] }
        socioId: { type: string, minLength: 1, maxLength: 40 }

    Dispositivo:
      type: object
      additionalProperties: false
      required: [tipo, valorAsegurado, antiguedadMeses]
      properties:
        tipo: { type: string, enum: [CELULAR, PORTATIL, TABLET] }
        valorAsegurado: { type: number, exclusiveMinimum: 0, maximum: 50000000 }
        antiguedadMeses: { type: integer, minimum: 0, maximum: 120 }

    Solicitante:
      type: object
      additionalProperties: false
      required: [edad, pais]
      properties:
        edad: { type: integer, minimum: 18, maximum: 99 }
        pais: { type: string, enum: [CO] }

    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required: [ramo, canal, dispositivo, solicitante]
      properties:
        ramo: { $ref: '#/components/schemas/Ramo' }
        canal: { $ref: '#/components/schemas/Canal' }
        dispositivo: { $ref: '#/components/schemas/Dispositivo' }
        solicitante: { $ref: '#/components/schemas/Solicitante' }

    PrimaDesglose:
      type: object
      additionalProperties: false
      required: [primaPura, gastos, impuestos, total, moneda]
      properties:
        primaPura: { type: number, minimum: 0 }
        gastos: { type: number, minimum: 0 }
        impuestos: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        moneda: { $ref: '#/components/schemas/Moneda' }

    Cobertura:
      type: object
      additionalProperties: false
      required: [codigo, nombre, sumaAsegurada, deducible]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        sumaAsegurada: { type: number, minimum: 0 }
        deducible: { type: number, minimum: 0 }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    Cotizacion:
      type: object
      additionalProperties: false
      required: [id, estado, ramo, prima, coberturas, vigenciaCotizacion, creadaEn]
      properties:
        id: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoCotizacion' }
        ramo: { $ref: '#/components/schemas/Ramo' }
        prima: { $ref: '#/components/schemas/PrimaDesglose' }
        coberturas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Cobertura' }
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
