openapi: 3.1.3

info:
  title: svc-cotizacion — Cotización de vida hipotecario
  summary: Cotización personalizada de seguro de vida sobre crédito hipotecario.
  description: |
    Recibe los datos del crédito y el cuestionario de hábitos de un cliente
    autenticado, pide el perfil de riesgo al servicio de Perfilamiento y devuelve
    un precio (personalizado o, si el perfilamiento no responde, estándar).

    Historia funcional: BITS-95 (hija de BITS-72). Perfilamiento: BITS-80.
    Diseño de referencia: pagina "Cotizacion y Rating" de David (Confluence).
    NFR: BITS-79 (latencia), BITS-81 (escalabilidad), BITS-124 (disponibilidad).

    ALCANCE de esta version (0.1.x): el precio de UNA poliza (Opcion Vida).
    Fuera de alcance: configurador de coberturas y add-ons, opcion Vida + Hogar,
    paths APROBADA / RECHAZADA (todo eso es BITS-96); retomar formulario a medias
    (AC-5) y bloqueo por cotizacion activa (AC-6).

    Identidad y consentimiento los resuelven el API Gateway y el BFF; este servicio
    recibe el id del cliente en el encabezado X-Cliente-Id.

    Convenciones de datos (VI-002): montos en COP como numero; ids en formato UUID.

    Errores en formato RFC 9457 (Problem Details), application/problem+json.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/cotizacion
    description: Entorno de desarrollo

tags:
  - name: Cotización
    description: Generación y consulta de cotizaciones de vida hipotecario.

paths:
  /cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Genera un precio a partir de los datos del crédito y el cuestionario
      description: |
        AC-1: valida los campos, registra la solicitud y pide el perfil de riesgo.
        AC-3: si un campo del credito esta fuera de rango (edad > 65, valor < 10.000.000
        COP, plazo < 12 meses) responde 400 senalando el campo.
        Si el Perfilamiento no responde a tiempo, devuelve el precio estandar con
        personalizado: false (no es un error).
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCotizacion' }
      responses:
        '201':
          description: Cotización generada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '503': { $ref: '#/components/responses/NoSePudoCotizar' }

  /cotizaciones/{id}:
    get:
      operationId: obtenerCotizacion
      tags: [Cotización]
      summary: Consulta una cotización ya generada (AC-4)
      parameters:
        - $ref: '#/components/parameters/ClienteId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La cotización.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:

  parameters:
    ClienteId:
      name: X-Cliente-Id
      in: header
      required: true
      description: Id del cliente autenticado. Lo inyecta el BFF a partir del token.
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada, esquema inválido o un campo fuera de rango (AC-3).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: No existe una cotización con ese id para el cliente.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoSePudoCotizar:
      description: No se pudo calcular ni el precio estándar (perfilamiento y tarifas no disponibles).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:

    ActividadFisica:
      type: string
      enum: [NUNCA, OCASIONAL, REGULAR]

    NivelRiesgo:
      type: string
      enum: [BAJO, MEDIO, ALTO]

    EstadoCotizacion:
      type: string
      enum: [VIGENTE, EXPIRADA]

    EfectoFactor:
      type: string
      enum: [POSITIVO, NEGATIVO]

    Moneda:
      type: string
      enum: [COP]

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoMeses, edad, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito:
          type: number
          minimum: 10000000
          description: Monto del crédito en COP. AC-3 rechaza < 10.000.000.
        plazoMeses:
          type: integer
          minimum: 12
          maximum: 480
          description: Plazo del crédito en meses. AC-3 rechaza < 12.
        edad:
          type: integer
          minimum: 18
          maximum: 65
          description: Edad del solicitante. AC-3 rechaza > 65.
        entidadAcreedora:
          type: string
          minLength: 2
          maxLength: 80
        saldoInsoluto:
          type: number
          exclusiveMinimum: 0
          description: Saldo pendiente del crédito en COP.

    CuestionarioHabitos:
      type: object
      additionalProperties: false
      required: [consumeTabaco, actividadFisica, condicionesPreexistentes, dependientesEconomicos]
      properties:
        consumeTabaco: { type: boolean }
        actividadFisica: { $ref: '#/components/schemas/ActividadFisica' }
        condicionesPreexistentes: { type: boolean }
        dependientesEconomicos: { type: integer, minimum: 0, maximum: 20 }

    SolicitudCotizacion:
      type: object
      additionalProperties: false
      required: [datosCredito, cuestionarioHabitos]
      properties:
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        cuestionarioHabitos: { $ref: '#/components/schemas/CuestionarioHabitos' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion:
          type: string
          description: En lenguaje no técnico (BITS-109). No expone datos financieros crudos.
        efecto: { $ref: '#/components/schemas/EfectoFactor' }
        pesoRelativo: { type: number, minimum: 0, maximum: 1 }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { $ref: '#/components/schemas/NivelRiesgo' }
        factores:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado]
      properties:
        primaMensual:
          type: number
          minimum: 0
          description: Prima aplicada. Igual a primaBaseMensual si personalizado es false.
        primaBaseMensual:
          type: number
          minimum: 0
          description: Prima con tarifa estándar, sin ajuste por perfil.
        sumaAsegurada:
          type: number
          minimum: 0
          description: Cobertura = saldo insoluto del crédito (protección de la deuda).
        coberturaMeses:
          type: integer
          minimum: 12
          description: Igual al plazo del crédito.
        moneda: { $ref: '#/components/schemas/Moneda' }
        personalizado:
          type: boolean
          description: false = el perfilamiento no respondió y se usó tarifa estándar (respuesta degradada).
        fuentesNoDisponibles:
          type: array
          items: { type: string }
          description: Fuentes de perfilamiento que no respondieron.

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    Cotizacion:
      type: object
      additionalProperties: false
      required: [id, estado, producto, oferta, vigenciaCotizacion, creadaEn]
      properties:
        id: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoCotizacion' }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          description: Presente solo cuando oferta.personalizado es true.
          $ref: '#/components/schemas/PerfilRiesgo'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }